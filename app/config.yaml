app:
  name: PDFOCR
  theme: dark
  window_size:
  - 1400
  - 900
appearance:
  animations_enabled: true
  theme: dark
batch:
  max_workers: 4
  retry_times: 2
export:
  include_confidence: true
ocr:
  engine: gguf
  gguf:
    auxiliary_parsing:
      footer: false
      footer_image: false
      footnote: false
      header: false
      header_image: false
      margin_text: false
      page_number: true
    confidence_threshold: 1.0
    device: gpu
    host: 127.0.0.1
    idle_unload_seconds: 300
    layout_geometry: auto
    max_pixels: 1003520
    max_tokens: 2048
    min_pixels: 112896
    mmproj_offload: true
    mmproj_path: models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
    model_params:
      chart_recognition: true
      cross_page_table_merge: true
      distortion_correction: false
      heading_level_recognition: true
      image_text_recognition: true
      layout_analysis: true
      orientation_correction: false
      seal_recognition: true
    model_path: models/PaddleOCR-VL-1.6-GGUF.gguf
    n_gpu_layers: 999
    nms_postprocess: true
    port: 8080
    prompt_type: text
    repetition_penalty: 1.0
    server_path: llama-b9969/llama-server.exe
    stability: 0.0
    temperature: 0.0
pdf:
  render_dpi: 200
