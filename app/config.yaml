# PDFOCR 运行配置（app/config.yaml，独立识别程序读取）
# 注意：应用「保存配置」时会程序化重写本文件（注释丢失、键按字母排序）；
# 本版本为手工恢复注释的快照。日常修改建议走应用内设置界面。

app:
  name: PDFOCR
  theme: dark
  window_size:
  - 1400
  - 900
appearance:
  animations_enabled: true
  theme: dark
batch:
  max_workers: 4
  retry_times: 2
export:
  include_confidence: true
ocr:
  engine: paddle_vl  # 识别引擎：paddle_vl（独立识别程序默认）/ rapidocr / gguf
  paddle_vl:
    # 逐块 Spotting（版面分析）：true = 布局切块逐块识别（可过滤辅助内容、
    # 图表/印章/图片专用识别生效）；false = 整页模式（每行文字都带高亮框）。
    # 与 use_layout_detection 等价，解析配置弹窗双键同值写入
    block_spotting: false
    use_layout_detection: false
    # 辅助内容过滤：识别前忽略的布局标签（仅版面分析逐块模式生效）
    markdown_ignore_labels:
    - header
    - header_image
    - footer
    - footer_image
    - footnote
    - aside_text
    # 生成上限：native 无重复惩罚，greedy 可能重复循环跑满上限（10000 → ~315s/页）；
    # 4096 足够 138 行输出（~1200 token），最坏 ~129s/页
    max_new_tokens: 4096
    # 跨页表格合并（仅版面分析逐块模式生效）
    merge_layout_blocks: true
    # 重复惩罚：直接注入 generation_config 打破重复循环（0 = 禁用，官方 greedy）
    repetition_penalty: 1.1
    # spotting 像素上限（官方默认 1605632，坐标精度优先）：降低上限省显存，
    # 但 VLM smart_resize 缩放失真放大 → 预览高亮坐标偏移；0 = 回退官方默认
    spotting_max_pixels: 1605632
    # spotting 像素下限：0 = 回退官方 112896，一般无需修改
    spotting_min_pixels: 0
    # 以下开关仅版面分析逐块模式生效（图表/印章/图片关闭 = 对应区域跳过）
    use_chart_recognition: true
    # 方向/扭曲矫正为构造期参数：开启加载 DocPreprocessor（额外显存），修改需重启引擎
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    use_ocr_for_image_block: true
    use_seal_recognition: true
    # 视觉注意力 SDPA（flash）：Windows 官方默认禁用 → 全量注意力物化
    # fp32 矩阵（峰值 6.4GB）；启用后峰值 4.2GB、质量无损（0 = 禁用回 eager）
    vision_sdpa: 1
  gguf:
    auxiliary_parsing:
      footer: false
      footer_image: false
      footnote: false
      header: false
      header_image: false
      margin_text: false
      page_number: true
    confidence_threshold: 1.0
    device: gpu
    host: 127.0.0.1
    idle_unload_seconds: 300
    layout_geometry: auto
    max_pixels: 1003520
    max_tokens: 2048
    min_pixels: 112896
    mmproj_offload: true
    mmproj_path: models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
    model_params:
      chart_recognition: true
      cross_page_table_merge: true
      distortion_correction: false
      heading_level_recognition: true
      image_text_recognition: true
      layout_analysis: true
      orientation_correction: false
      seal_recognition: true
    model_path: models/PaddleOCR-VL-1.6-GGUF.gguf
    n_gpu_layers: 999
    nms_postprocess: true
    port: 8080
    prompt_type: text
    repetition_penalty: 1.0
    server_path: llama-b9969/llama-server.exe
    stability: 0.0
    temperature: 0.0
pdf:
  render_dpi: 200
