app:
  name: PDF OCR Tool
  version: 2.0.0
  window_size:
  - 1600
  - 1000
batch:
  max_workers: 4
  retry_times: 2
export:
  default_format: xlsx
  include_confidence: true
finance:
  enabled: false
  invoice:
    keywords:
    - 发票号码
    - 开票日期
    - 价税合计
    - 购买方
    - 销售方
  validation:
    amount_tolerance: 0.01
    tax_rate: 0.13
layout_visualization:
  colors:
    chart: '#8E44AD'
    formula: '#E67E22'
    seal: '#E74C3C'
    table: '#27AE60'
    text: '#4A90D9'
  enabled: true
structured:
  # P1 双向高亮：RapidOCR 行盒检测层（语义与坐标解耦）。默认关 —
  # 需先跑探针验证检测精度（中位中心误差 < 3px）再开启。
  detection: false
ocr:
  det_db_box_thresh: 0.5
  drop_score: 0.5
  engine: gguf
  lang: ch
  gguf:
    device: gpu
    host: 127.0.0.1
    idle_unload_seconds: 300
    max_tokens: 512
    mmproj_offload: true
    mmproj_path: models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
    model_path: models/PaddleOCR-VL-1.6-GGUF.gguf
    n_gpu_layers: 999
    port: 8080
    server_path: llama-b9969/llama-server.exe
    temperature: 0.0
  rapidocr:
    det_db_box_thresh: 0.3
    drop_score: 0.5
    lang: ch
    use_gpu: false
  use_angle_cls: true
  use_gpu: true
pdf:
  max_preview_size: 2000
  render_dpi: 200
