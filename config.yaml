app:
  name: PDF OCR Tool
  version: 2.0.0
  window_size:
  - 1600
  - 1000
appearance:
  animations_enabled: true
  theme: auto
batch:
  max_workers: 4
  retry_times: 2
export:
  default_format: xlsx
  include_confidence: true
finance:
  enabled: false
  invoice:
    keywords:
    - 发票号码
    - 开票日期
    - 价税合计
    - 购买方
    - 销售方
  validation:
    amount_tolerance: 0.01
    tax_rate: 0.13
layout_visualization:
  colors:
    chart: '#8E44AD'
    formula: '#E67E22'
    seal: '#E74C3C'
    table: '#27AE60'
    text: '#4A90D9'
  enabled: true
ocr:
  det_db_box_thresh: 0.5
  drop_score: 0.5
  engine: rapidocr
  gguf:
    auxiliary_parsing:
      footer: false
      footer_image: false
      footnote: false
      header: false
      header_image: false
      margin_text: false
      page_number: true
    confidence_threshold: 1.0
    device: gpu
    host: 127.0.0.1
    idle_unload_seconds: 300
    layout_geometry: auto
    max_pixels: 2822144
    max_tokens: 512
    min_pixels: 146432
    mmproj_offload: true
    mmproj_path: models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
    model_params:
      chart_recognition: true
      cross_page_table_merge: true
      distortion_correction: false
      heading_level_recognition: true
      image_text_recognition: true
      layout_analysis: true
      orientation_correction: false
      seal_recognition: true
    model_path: models/PaddleOCR-VL-1.6-GGUF.gguf
    n_gpu_layers: 999
    nms_postprocess: true
    port: 8080
    prompt_type: table
    repetition_penalty: 1.0
    server_path: llama-b9969/llama-server.exe
    stability: 0.0
    temperature: 0.0
  lang: ch
  rapidocr:
    det_db_box_thresh: 0.3
    drop_score: 0.5
    lang: ch
    use_gpu: false
  use_angle_cls: true
  use_gpu: true
pdf:
  max_preview_size: 2000
  render_dpi: 200
