app:
  name: PDF OCR Tool
  version: 2.0.0
  window_size:
  - 1600
  - 1000
pdf:
  render_dpi: 200
  max_preview_size: 2000
ocr:
  engine: paddleocr_vl
  lang: ch
  use_gpu: true
  use_angle_cls: true
  det_db_box_thresh: 0.5
  drop_score: 0.5
  paddleocr_vl:
    vl_rec_model_name: PaddleOCR-VL-1.6-0.9B
    device: gpu:0
    precision: fp16
    use_layout_detection: false
    warmup_on_startup: false
    idle_unload_seconds: 300
    page_dpi: 200
    high_quality_dpi: 300
    match_iou_threshold: 0.5
    match_neighbor_radius: 50
  rapidocr:
    use_gpu: false
    lang: ch
    det_db_box_thresh: 0.3
    drop_score: 0.5
batch:
  max_workers: 4
  retry_times: 2
export:
  default_format: xlsx
  include_confidence: true
  include_source_file: true
