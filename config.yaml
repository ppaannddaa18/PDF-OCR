app:
  name: PDF OCR Tool
  version: 2.0.0
  window_size:
  - 1600
  - 1000
appearance:
  animations_enabled: true
  theme: auto
batch:
  max_workers: 4
  retry_times: 2
export:
  default_format: xlsx
  include_confidence: true
finance:
  enabled: false
  invoice:
    keywords:
    - 发票号码
    - 开票日期
    - 价税合计
    - 购买方
    - 销售方
  validation:
    amount_tolerance: 0.01
    tax_rate: 0.13
layout_visualization:
  colors:
    chart: '#8E44AD'
    formula: '#E67E22'
    seal: '#E74C3C'
    table: '#27AE60'
    text: '#4A90D9'
  enabled: true
ocr:
  det_db_box_thresh: 0.5
  drop_score: 0.5
  engine: rapidocr
  paddle_vl:
    # 官方管线（paddlex native）整页 Spotting 参数
    # 生成上限：native 无重复惩罚，greedy 可能重复循环跑满上限（10000 → ~315s/页）；
    # 4096 足够 138 行输出（~1200 token），最坏 ~129s/页
    max_new_tokens: 4096
    # 重复惩罚：直接注入 generation_config 打破重复循环（0 = 禁用，官方 greedy）
    repetition_penalty: 1.1
    # 视觉注意力 SDPA（flash）：Windows 官方默认禁用 → 全量注意力物化
    # fp32 矩阵（峰值 6.4GB）；启用后峰值 4.2GB、质量无损（0 = 禁用回 eager）
    vision_sdpa: 1
    # spotting 像素上限（官方默认 1605632，坐标精度优先）：降低上限省显存
    # （1048576 实测 138 行/38.9s/峰值 6.8GB），但 VLM smart_resize 缩放
    # 失真放大 → 预览高亮坐标偏移（实测 200dpi 垂直 +6.6~+9.6px、水平
    # -9~-11px）；官方值仅 -1.6~-2px（本机 8GB 卡实测 1.6M 无 OOM）
    spotting_max_pixels: 1605632
    # 逐块 Spotting（布局切块 + 每块坐标偏移映射）：默认关闭（整页模式）。
    # 纯文本文档可省 ~25% 时间；表格文档收益有限（表格是单一大块）
    block_spotting: false
    # 版面预处理与后处理开关（独立识别程序默认）
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    use_chart_recognition: true
    use_seal_recognition: true
    use_ocr_for_image_block: true
    merge_layout_blocks: true
    spotting_min_pixels: 0
    markdown_ignore_labels: ["header", "header_image", "footer", "footer_image", "footnote", "aside_text"]
  gguf:
    auxiliary_parsing:
      footer: false
      footer_image: false
      footnote: false
      header: false
      header_image: false
      margin_text: false
      page_number: true
    confidence_threshold: 1.0
    device: gpu
    host: 127.0.0.1
    idle_unload_seconds: 300
    layout_geometry: auto
    max_pixels: 1003520
    max_tokens: 2048
    min_pixels: 112896
    mmproj_offload: true
    mmproj_path: models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
    model_params:
      chart_recognition: true
      cross_page_table_merge: true
      distortion_correction: false
      heading_level_recognition: true
      image_text_recognition: true
      layout_analysis: true
      orientation_correction: false
      seal_recognition: true
    model_path: models/PaddleOCR-VL-1.6-GGUF.gguf
    n_gpu_layers: 999
    nms_postprocess: true
    port: 8080
    prompt_type: text
    repetition_penalty: 1.0
    server_path: llama-b9969/llama-server.exe
    stability: 0.0
    temperature: 0.0
  lang: ch
  rapidocr:
    det_db_box_thresh: 0.3
    drop_score: 0.5
    lang: ch
    use_gpu: false
  use_angle_cls: true
  use_gpu: true
pdf:
  max_preview_size: 2000
  render_dpi: 200
